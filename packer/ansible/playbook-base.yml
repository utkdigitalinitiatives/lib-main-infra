---
# Base Image Playbook
# This playbook configures system-level dependencies for Drupal.
# It is run monthly to create the base image that app builds inherit from.
# Time-consuming tasks (dnf update, package installation) happen here.

- name: Configure base system for Drupal application server
  hosts: all
  become: true

  vars:
    php_version: "{{ php_version | default('8.3') }}"
    drupal_user: "drupal"
    drupal_group: "drupal"
    web_root: "/var/www/drupal"

  tasks:
    # ==========================================================================
    # Wait for OIT's Defender and Azure Monitor agent installs
    # ==========================================================================
    # OIT's Azure Policy installs MDE.Linux (package mdatp) and
    # AzureMonitorLinuxAgent (package azuremonitoragent) on every new VM, the
    # Packer build VM too, about 10.5 minutes after it is created. The installs
    # hold the rpm and SELinux locks, so any task that runs in that window can
    # fail. Wait until both packages are installed and no package manager is
    # running, then do the real work. The agents are removed again at the end of
    # this playbook, before capture.
    #
    # Gives up after about 30 minutes and continues, so a build still works if
    # the agents never arrive (for example, OIT exempts the gallery RG). If OIT
    # does exempt it, delete this task: it then only adds 30 minutes per build.
    - name: Wait for the Defender and Azure Monitor agent installs to finish
      ansible.builtin.shell: |
        rpm -q mdatp azuremonitoragent >/dev/null || exit 1
        pgrep -x 'rpm|dnf|yum|semodule' >/dev/null && exit 1
        sleep 60
        ! pgrep -x 'rpm|dnf|yum|semodule' >/dev/null
      register: _agents_wait
      until: _agents_wait.rc == 0
      retries: 60
      delay: 30
      changed_when: false
      failed_when: false

    - name: Report that the agents never arrived
      ansible.builtin.debug:
        msg: "Defender / Azure Monitor agents not installed after about 30 minutes. Continuing without them."
      when: _agents_wait.rc != 0

    # ==========================================================================
    # System updates and repositories (the big time-saver: ~5 min)
    # ==========================================================================
    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true

    - name: Install EPEL repository
      ansible.builtin.dnf:
        name: epel-release
        state: present

    - name: Install Remi repository
      ansible.builtin.dnf:
        name: "https://rpms.remirepo.net/enterprise/remi-release-9.rpm"
        state: present
        disable_gpg_check: true

    - name: Reset PHP module
      ansible.builtin.command: dnf module reset php -y
      changed_when: true

    - name: Enable PHP {{ php_version }} module from Remi
      ansible.builtin.command: "dnf module enable php:remi-{{ php_version }} -y"
      changed_when: true

    # ==========================================================================
    # Package installation
    # ==========================================================================
    - name: Install required packages
      ansible.builtin.dnf:
        name:
          # Web server
          - httpd
          - mod_ssl
          # PHP and extensions
          - php
          - php-fpm
          - php-cli
          - php-common
          - php-pdo
          - php-pgsql
          - php-mysqlnd
          - php-gd
          - php-mbstring
          - php-xml
          - php-json
          - php-opcache
          - php-curl
          - php-zip
          - php-intl
          - php-bcmath
          - php-soap
          # Development tools
          - git
          - unzip
          - patch
          # Database client
          - postgresql
          # Utilities
          - vim-enhanced
          - htop
          - curl
          - wget
          # CIFS client for mounting Azure Files (durable private:// storage)
          - cifs-utils
          # SELinux tools
          - policycoreutils-python-utils
          - setools-console
          # Firewall
          - firewalld
        state: present

    # ==========================================================================
    # Composer installation
    # ==========================================================================
    - name: Download Composer installer
      ansible.builtin.get_url:
        url: https://getcomposer.org/installer
        dest: /tmp/composer-setup.php
        mode: "0644"

    - name: Install Composer globally
      ansible.builtin.command: php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
      args:
        creates: /usr/local/bin/composer

    - name: Remove Composer installer
      ansible.builtin.file:
        path: /tmp/composer-setup.php
        state: absent

    # ==========================================================================
    # User and group creation
    # ==========================================================================
    - name: Create drupal group
      ansible.builtin.group:
        name: "{{ drupal_group }}"
        system: true
        state: present

    - name: Create drupal user
      ansible.builtin.user:
        name: "{{ drupal_user }}"
        group: "{{ drupal_group }}"
        groups: apache
        create_home: true
        home: "/home/{{ drupal_user }}"
        shell: /bin/bash
        system: true
        state: present

    - name: Add apache user to drupal group
      ansible.builtin.user:
        name: apache
        groups: "{{ drupal_group }}"
        append: true

    # ==========================================================================
    # Directory structure
    # ==========================================================================
    - name: Create web root directory
      ansible.builtin.file:
        path: "{{ web_root }}"
        state: directory
        owner: "{{ drupal_user }}"
        group: "{{ drupal_group }}"
        mode: "0755"

    - name: Create Drupal config directory
      ansible.builtin.file:
        path: /etc/drupal
        state: directory
        owner: root
        group: "{{ drupal_group }}"
        mode: "0750"

    # ==========================================================================
    # PHP-FPM configuration
    # ==========================================================================
    - name: Configure PHP-FPM pool for Drupal
      ansible.builtin.template:
        src: templates/php-fpm-drupal.conf.j2
        dest: /etc/php-fpm.d/drupal.conf
        mode: "0644"
      notify: restart php-fpm

    - name: Remove default PHP-FPM www pool
      ansible.builtin.file:
        path: /etc/php-fpm.d/www.conf
        state: absent
      notify: restart php-fpm

    - name: Configure PHP settings
      ansible.builtin.lineinfile:
        path: /etc/php.ini
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: "^memory_limit", line: "memory_limit = 256M" }
        - { regexp: "^upload_max_filesize", line: "upload_max_filesize = 64M" }
        - { regexp: "^post_max_size", line: "post_max_size = 64M" }
        - { regexp: "^max_execution_time", line: "max_execution_time = 300" }
        - { regexp: "^;?date.timezone", line: "date.timezone = UTC" }
      notify: restart php-fpm

    # ==========================================================================
    # Apache configuration
    # ==========================================================================
    - name: Configure Apache for Drupal
      ansible.builtin.template:
        src: templates/apache-drupal.conf.j2
        dest: /etc/httpd/conf.d/drupal.conf
        mode: "0644"
      notify: restart httpd

    - name: Remove default Apache welcome page
      ansible.builtin.file:
        path: /etc/httpd/conf.d/welcome.conf
        state: absent
      notify: restart httpd

    - name: Disable default SSL configuration
      ansible.builtin.file:
        path: /etc/httpd/conf.d/ssl.conf
        state: absent
      notify: restart httpd

    - name: Enable httpd service
      ansible.builtin.systemd:
        name: httpd
        enabled: true

    - name: Enable php-fpm service
      ansible.builtin.systemd:
        name: php-fpm
        enabled: true

    # ==========================================================================
    # Firewall configuration
    # ==========================================================================
    - name: Enable firewalld
      ansible.builtin.systemd:
        name: firewalld
        enabled: true
        state: started

    - name: Open HTTP port
      ansible.posix.firewalld:
        port: 80/tcp
        permanent: true
        state: enabled
        immediate: true

    - name: Open HTTPS port
      ansible.posix.firewalld:
        port: 443/tcp
        permanent: true
        state: enabled
        immediate: true

    # ==========================================================================
    # SELinux configuration
    # ==========================================================================
    # Defender for Cloud installs MDE.Linux and AzureMonitorLinuxAgent on every new
    # VM, the Packer build VM too, about 11 minutes after it is created. On the
    # 2026-10-07 base build, the first task below failed 90 seconds after those
    # installs started, with "BlockingIOError: [Errno 11] Resource temporarily
    # unavailable" - most likely the installs holding the SELinux policy store
    # lock. So each policy change below retries until the lock is free.
    - name: Set SELinux context for web root
      community.general.sefcontext:
        target: "{{ web_root }}(/.*)?"
        setype: httpd_sys_rw_content_t
        state: present
      register: selinux_result
      until: selinux_result is succeeded
      retries: 10
      delay: 30

    - name: Apply SELinux context
      ansible.builtin.command: "restorecon -Rv {{ web_root }}"
      changed_when: true

    - name: Allow httpd to connect to network
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: true
      register: selinux_result
      until: selinux_result is succeeded
      retries: 10
      delay: 30

    - name: Allow httpd to connect to database
      ansible.posix.seboolean:
        name: httpd_can_network_connect_db
        state: true
        persistent: true
      register: selinux_result
      until: selinux_result is succeeded
      retries: 10
      delay: 30

    # ==========================================================================
    # Image manifest (captures installed versions for CI/CD readout)
    # ==========================================================================
    - name: Get OS release
      ansible.builtin.command: cat /etc/redhat-release
      register: _manifest_os
      changed_when: false

    - name: Get kernel version
      ansible.builtin.command: uname -r
      register: _manifest_kernel
      changed_when: false

    - name: Get PHP version
      ansible.builtin.command: php -r 'echo PHP_VERSION;'
      register: _manifest_php
      changed_when: false

    - name: Get Apache version
      ansible.builtin.command: rpm -q httpd
      register: _manifest_httpd
      changed_when: false

    - name: Get Composer version
      ansible.builtin.shell: composer --version 2>/dev/null | head -1
      register: _manifest_composer
      changed_when: false

    - name: Get PostgreSQL client version
      ansible.builtin.shell: psql --version | head -1
      register: _manifest_psql
      changed_when: false

    - name: Write image manifest
      ansible.builtin.copy:
        content: |
          {
            "os": {{ _manifest_os.stdout | to_json }},
            "kernel": {{ _manifest_kernel.stdout | to_json }},
            "php": {{ _manifest_php.stdout | to_json }},
            "httpd": {{ _manifest_httpd.stdout | to_json }},
            "composer": {{ _manifest_composer.stdout | to_json }},
            "postgresql_client": {{ _manifest_psql.stdout | to_json }}
          }
        dest: /etc/image-manifest.json
        mode: "0644"

    # ==========================================================================
    # Remove OIT's Defender and Azure Monitor agents before capture
    # ==========================================================================
    # `waagent -deprovision` does not remove these packages or their state. If
    # they are captured, every VM made from this image starts an already
    # onboarded Defender, and Microsoft warns the clones can report as one
    # device. Packer checks again just before capture and fails the build if
    # any of this is still present.
    - name: Remove the Defender and Azure Monitor agent packages
      ansible.builtin.dnf:
        name:
          - mdatp
          - azuremonitoragent
        state: absent

    - name: Remove the Defender and Azure Monitor agent state
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/opt/microsoft/mdatp
        - /var/opt/microsoft/mdatp
        - /opt/microsoft/mdatp
        - /var/log/microsoft/mdatp
        - /etc/opt/microsoft/azuremonitoragent
        - /var/opt/microsoft/azuremonitoragent
        - /opt/microsoft/azuremonitoragent

    # The Defender installer adds the packages.microsoft.com repo to fetch mdatp.
    # Nothing in this image uses it.
    - name: Find the Microsoft package repo the Defender installer added
      ansible.builtin.find:
        paths: /etc/yum.repos.d
        patterns: "*.repo"
        contains: '.*packages\.microsoft\.com'
      register: _ms_repos

    - name: Remove the Microsoft package repo
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _ms_repos.files }}"
      loop_control:
        label: "{{ item.path }}"

  handlers:
    - name: restart php-fpm
      ansible.builtin.systemd:
        name: php-fpm
        state: restarted

    - name: restart httpd
      ansible.builtin.systemd:
        name: httpd
        state: restarted

    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
