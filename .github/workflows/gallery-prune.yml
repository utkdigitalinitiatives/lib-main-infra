name: Prune Images and Build Leftovers

on:
  # Mid-month, deliberately NOT the 1st. base-image-build.yml runs at 00:00 on
  # the 1st and a hung base build has been observed running 6 hours (the
  # 2026-07-01 run, cancelled at the GitHub job limit), so anything earlier the
  # same day can collide with a build that is still publishing. The prune is
  # safe either way - gallery-prune.py skips versions that are not Succeeded -
  # but keeping them apart means a stuck base build never has a second job
  # muddying its logs. A fresh base is protected by the keep-newest rule
  # whenever the prune runs, so there is nothing to gain from running right
  # after the build.
  schedule:
    - cron: '0 4 15 * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Actually delete. Leave unchecked for a dry run.'
        required: false
        default: false
        type: boolean

env:
  # Safety net: force any JS action still declaring node20 onto the node24 runtime
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# Never let two prunes overlap - the second would plan against versions the
# first has already submitted for deletion. Queue rather than cancel, so a
# manual dry run cannot kill a scheduled prune mid-flight.
concurrency:
  group: gallery-prune
  cancel-in-progress: false

jobs:
  prune:
    name: Prune stale gallery versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Azure CLI Login
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      # Also catches build groups leaked by a run that was cancelled between image
      # builds, which the sweep inside the build workflows would otherwise only
      # notice on the next build.
      - name: Sweep leaked Packer build groups
        run: .github/scripts/packer-cleanup.sh sweep-build-groups 24

      # Safety net across every project that builds into the shared gallery.
      # Each repo deletes its own scratch image after its own build, but a build
      # killed at the wrong moment - or a repo that has not adopted that step -
      # leaves one behind. Nothing ever boots a scratch image, so anything over
      # 24h old is dead no matter which project made it.
      - name: Sweep stale scratch images
        run: .github/scripts/packer-cleanup.sh sweep-scratch-images lib-main-images-rg 24

      # The other leak shape: projects that pass build_resource_group_name build
      # inside an existing RG, so a dead build leaves loose pkrvm/pkrni/pkros
      # resources and no pkr-* group for the sweep above to find. mccarthy-infra
      # builds this way, and a leaked build VM bills the same either way.
      - name: Sweep stray Packer build resources
        run: .github/scripts/packer-cleanup.sh sweep-build-resources lib-main-images-rg 24

      # Scheduled runs delete. Manual runs are a dry run unless you tick the box.
      - name: Prune gallery versions
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            python3 .github/scripts/gallery-prune.py --apply | tee prune.log
          else
            python3 .github/scripts/gallery-prune.py | tee prune.log
          fi

      - name: Prune Summary
        if: always()
        run: |
          {
            echo "## Image and Build-Leftover Prune"
            echo ""
            echo '```'
            tail -n 60 prune.log 2>/dev/null || echo "No output - the prune step did not run."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
